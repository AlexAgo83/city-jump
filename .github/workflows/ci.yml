name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install --global @grifhinz/logics-manager@2.23.0
      - run: npm run ci
      - run: npx playwright install --with-deps chromium
      - name: Browser interaction check
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/city-jump-vite.log 2>&1 &
          trap 'cat /tmp/city-jump-vite.log' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5173 >/dev/null && break
            sleep 1
          done
          npm run test:e2e
