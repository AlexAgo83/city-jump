<!doctype html>
<meta charset="utf-8" />
<title>city-jump</title>
<meta name="theme-color" content="#171b20" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/icon-128.png" type="image/png" sizes="128x128" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1e23; }
  #app { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #toast {
    position: fixed; left: 50%; bottom: 116px; transform: translateX(-50%);
    font: 13px/1.4 ui-sans-serif, system-ui; color: #ffd9d0; background: #7a2718d0;
    padding: 8px 14px; border-radius: 6px; pointer-events: none; opacity: 0;
    transition: opacity .15s;
  }
  #toolbar {
    position: fixed; top: 12px; left: 12px; display: flex; align-items: stretch;
    max-width: calc(100vw - 24px); padding: 0; overflow: hidden;
    color: #e6ebef; background: #171b20e8; border: 1px solid #ffffff1f;
    border-radius: 6px; font: 12px/1.2 ui-sans-serif, system-ui; box-sizing: border-box;
  }
  #toolbar-content { display: flex; min-width: 0; }
  #toolbar-content[hidden] { display: none; }
  /* A fixed rail, so opening a section never reflows the panel or moves the game under it. */
  #toolbar-rail { display: flex; flex-direction: column; flex: none; border-right: 1px solid #ffffff14; padding: 3px 0; }
  .rail-btn {
    display: flex; align-items: center; justify-content: center; position: relative;
    width: 30px; height: 28px; padding: 0; border: 0; background: transparent;
    color: #616d77; cursor: pointer;
  }
  .rail-btn:hover { color: #e6ebef; background: #ffffff0a; }
  .rail-btn[aria-selected="true"] { color: #b9dbe7; background: #ffffff0f; }
  .rail-btn[aria-selected="true"]::before {
    content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 2px;
    border-radius: 0 2px 2px 0; background: #75b9d1;
  }
  .rail-btn:focus-visible { outline: 2px solid #75b9d1; outline-offset: -2px; }
  #toolbar-panes { display: flex; flex-direction: column; min-width: 0; width: 260px; }
  /* A short window must still show the whole rail, so a long section scrolls rather than
     pushing the panel down over the tools. */
  .pane { max-height: max(140px, calc(100vh - 470px)); overflow-y: auto; }
  #pane-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 10px; border-bottom: 1px solid #ffffff14;
  }
  #pane-name { color: #b9dbe7; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  #pane-hint { color: #7f8b95; font-size: 10px; }
  .pane { padding: 4px 10px 10px; }
  .pane[hidden] { display: none; }
  .toolbar-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    min-height: 22px; padding: 6px 0;
  }
  .toolbar-row + .toolbar-row { border-top: 1px solid #ffffff0d; }
  .toolbar-actions { display: grid; gap: 6px; padding: 4px 0 2px; }
  .toolbar-actions.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toolbar-actions.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .row-label {
    display: block; padding: 11px 0 3px; color: #7f8b95; font-size: 10px;
    letter-spacing: .08em; text-transform: uppercase;
  }
  #toolbar label { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .toolbar-row > label:first-child, .toolbar-row > span:first-child { flex: 1 1 auto; min-width: 0; }
  .toolbar-row input[type="range"] { flex: 0 1 112px; min-width: 72px; }
  #toolbar input, #toolbar select { accent-color: #75b9d1; }
  /* A switch reads at a glance down a right-hand column; a checkbox does not. */
  .pane input[type="checkbox"] {
    appearance: none; flex: none; position: relative; width: 26px; height: 15px; margin: 0;
    border: 1px solid #ffffff2b; border-radius: 8px; background: #272d34; cursor: pointer;
  }
  .pane input[type="checkbox"]::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 9px; height: 9px;
    border-radius: 50%; background: #7f8b95; transition: left .14s ease, background .14s ease;
  }
  .pane input[type="checkbox"]:checked { background: #33505b; border-color: #75b9d150; }
  .pane input[type="checkbox"]:checked::after { left: 13px; background: #b9dbe7; }
  .pane input[type="checkbox"]:focus-visible { outline: 2px solid #75b9d1; outline-offset: 2px; }
  .pane label { cursor: pointer; }
  .pane input[type="number"] { width: 62px; }
  #toolbar-toggle {
    width: 34px; min-height: 38px; padding: 0; border: 0; border-left: 1px solid #ffffff1f;
    color: #b9c3ca; background: transparent; cursor: pointer;
  }
  #toolbar-toggle:hover { color: #fff; background: #2b343b; }
  #toolbar-toggle:focus-visible { outline: 2px solid #75b9d1; outline-offset: -2px; }
  #toolbar.collapsed #toolbar-toggle { border-left: 0; }
  #toolbar.collapsed #toolbar-content { display: none; }
  .toolbar-glyph {
    display: inline-grid; gap: 4px; width: 18px; padding: 2px 0;
  }
  .toolbar-glyph i {
    display: block; height: 2px; border-radius: 2px; background: currentColor;
    transform-origin: center; animation: toolbar-pulse 1.8s ease-in-out infinite;
    transition: transform .25s ease, opacity .2s ease, width .25s ease;
  }
  .toolbar-glyph i:nth-child(1) { width: 13px; justify-self: start; }
  .toolbar-glyph i:nth-child(2) { width: 18px; justify-self: center; animation-delay: .15s; }
  .toolbar-glyph i:nth-child(3) { width: 10px; justify-self: end; animation-delay: .3s; }
  #toolbar.collapsed .toolbar-glyph i:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  #toolbar.collapsed .toolbar-glyph i:nth-child(2) { opacity: 0; transform: scaleX(.2); }
  #toolbar.collapsed .toolbar-glyph i:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  @keyframes toolbar-pulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.45); }
  }
  /* Same rule as the right-hand column: one anchored box, everything else flows inside it. */
  /* One surface, not two stacked boxes: the city's health and the clock are read together. */
  #left-stack {
    position: fixed; left: 12px; bottom: 12px; z-index: 2;
    display: flex; align-items: center; gap: 12px; padding: 8px 12px;
    max-width: calc(100vw - 24px); box-sizing: border-box;
    background: #11151aef; border: 1px solid #ffffff17; border-radius: 6px;
    box-shadow: 0 8px 22px #0006, inset 0 1px 0 #ffffff0d;
  }
  #time-controls {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    padding: 0 0 0 12px; width: max-content; box-sizing: border-box;
    color: #e6ebef; background: transparent; border: 0; border-left: 1px solid #ffffff12;
    align-self: stretch; justify-content: center;
    font: 12px/1.2 ui-sans-serif, system-ui;
  }
  #time-controls button {
    min-width: 34px; padding: 5px 8px; border: 0; border-right: 1px solid #ffffff18;
    color: #aeb8c0; background: transparent; font: inherit; cursor: pointer;
  }
  #time-controls button:last-child { border-right: 0; }
  #time-controls button[aria-pressed="true"] { color: #fff; background: #33505b; }
  #sim-time { min-width: 86px; color: #b9dbe7; font-variant-numeric: tabular-nums; }
  .segmented { display: flex; border: 1px solid #ffffff20; border-radius: 4px; overflow: hidden; }
  .segmented label { position: relative; }
  .segmented input { position: absolute; opacity: 0; }
  .segmented span { padding: 3px 7px; color: #a2aeb7; font-size: 10.5px; cursor: pointer; }
  .segmented input:checked + span { color: #fff; background: #33505b; }
  #toolbar select { color: #e6ebef; background: #272d34; border: 1px solid #ffffff2b; border-radius: 4px; padding: 3px 5px; }
  #sun-hour { flex: 1 1 104px; min-width: 80px; }
  #save-slot { flex: 1 1 0; min-width: 0; }
  #toolbar button:not(#toolbar-toggle, .rail-btn) {
    color: #e6ebef; background: #272d34; border: 1px solid #ffffff2b; border-radius: 4px;
    padding: 3px 8px; cursor: pointer; font: inherit;
  }
  #toolbar button:not(#toolbar-toggle, .rail-btn):hover { background: #333c45; }
  #toolbar button:disabled { opacity: 0.45; cursor: default; }
  #sun-time { width: 38px; color: #b9dbe7; font-variant-numeric: tabular-nums; }
  /* One surface: the active tool's options sit beside the tools that own them, not floating above. */
  /*
   * The tools take a rail down the left edge instead of the bottom, so the widest thing on screen
   * stays the city. The active tool's options open beside the rail and hug their content -- a
   * bottom dock had to be as wide as its widest tool set, empty or not.
   */
  /* Anchored just above the city block, so it grows upward and the settings panel grows
     downward -- they meet in the middle instead of sharing a corner. */
  #action-dock {
    position: fixed; left: 12px; bottom: 180px; z-index: 2;
    display: flex; align-items: flex-start; gap: 6px;
    max-width: calc(100vw - 24px); box-sizing: border-box;
  }
  #action-palette {
    display: flex; flex-direction: column; gap: 2px; padding: 4px; flex: none;
    overflow: visible;
    background: #11151aef; border: 1px solid #ffffff17; border-radius: 6px;
    box-shadow: 0 8px 22px #0006, inset 0 1px 0 #ffffff0d;
  }
  #tool-options-stack { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  /*
   * A short window cannot hold a seven-tool column beside a settings panel and the city block.
   * Below 700px tall the rail lies down on the bottom-right instead, options above it -- the same
   * shape the console direction used, kept for exactly this case.
   */
  /* Narrower than this the panel would sit on the status bar, so it opens below it instead. */
  @media (max-width: 940px) {
    #toolbar { top: 62px; }
    #compass { top: 112px; }
    .pane { max-height: max(120px, calc(100vh - 520px)); }
  }
  @media (max-height: 700px) {
    #action-dock {
      left: auto; right: 12px; bottom: 12px; flex-direction: column-reverse; align-items: flex-end;
    }
    #action-palette { flex-direction: row; }
    .tool-button { width: 52px; min-height: 40px; font-size: 9.5px; }
    /* Side by side, not stacked: stacked they grew tall enough to cover the map a player is
       trying to click on. */
    #tool-options-stack { flex-direction: row; align-items: flex-end; }
    .tool-options { max-width: 260px; }
  }
  .tool-button {
    width: 38px; min-height: 34px; padding: 6px 0 5px; border: 0; border-radius: 5px;
    color: #8b97a1; background: transparent; cursor: pointer; white-space: nowrap;
    font: 8.5px/1.2 ui-sans-serif, system-ui;
  }
  .tool-button[aria-pressed="true"] { color: #fff; background: #33505b; }
  .tool-button:disabled { color: #6f7a82; cursor: not-allowed; }
  .tool-button:hover { color: #e8edf1; background: #ffffff0d; }
  .tool-button:focus-visible { outline: 2px solid #75b9d1; outline-offset: -2px; }
  /* No width cap here: a capped options group clipped the road-type segmented rather than
     letting the dock wrap, which is the one thing an options row must never do. */
  /* A column that is only as wide as what it holds, never a box waiting to be filled. */
  .tool-options {
    display: flex; flex-direction: column; align-items: stretch; gap: 7px;
    width: max-content; max-width: 216px; padding: 8px 10px; box-sizing: border-box;
    font-size: 11px; color: #a6b1ba;
    background: #11151aef; border: 1px solid #ffffff17; border-radius: 6px;
    box-shadow: 0 8px 22px #0006, inset 0 1px 0 #ffffff0d;
  }
  .tool-options > label { justify-content: space-between; }
  /* Eight road types cannot ride one strip in a 216px column, so inside the options panel a
     segmented wraps into pills rather than hiding its tail behind `overflow: hidden`. */
  .tool-options .segmented {
    width: 100%; display: flex; flex-wrap: wrap; gap: 3px; border: 0; overflow: visible;
  }
  .tool-options .segmented label { flex: 1 1 auto; }
  .tool-options .segmented span {
    display: block; text-align: center; border: 1px solid #ffffff20; border-radius: 4px;
  }
  .tool-options[hidden] { display: none; }
  .tool-options label { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .tool-options input, .tool-options select { accent-color: #75b9d1; }
  /* The same switch the settings panel uses, so a toggle looks like a toggle everywhere. */
  .tool-options input[type="checkbox"] {
    appearance: none; flex: none; position: relative; width: 24px; height: 14px; margin: 0;
    border: 1px solid #ffffff20; border-radius: 7px; background: #212830; cursor: pointer;
  }
  .tool-options input[type="checkbox"]::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 8px; height: 8px;
    border-radius: 50%; background: #7f8b95; transition: left .14s ease, background .14s ease;
  }
  .tool-options input[type="checkbox"]:checked { background: #33505b; border-color: #75b9d150; }
  .tool-options input[type="checkbox"]:checked::after { left: 12px; background: #b9dbe7; }
  .tool-options .price { color: #7d8892; font-variant-numeric: tabular-nums; }
  .tool-options select { color: #e6ebef; background: #272d34; border: 1px solid #ffffff2b; border-radius: 4px; padding: 3px 5px; }
  .tool-options input[type="range"] { width: 92px; }
  /*
   * Everything that lives in the top-right corner shares one column, stacked in a fixed order --
   * run line, selection -- and flows: whatever is hidden takes no room and the rest closes
   * up. Each of these used to carry its own `top`, so showing two at once overlapped them and
   * showing three needed a rule per pair.
   */
  /* The status bar owns the top edge, so this column starts below it and never has to fight it
     for the same pixels -- overlapping it made the bar swallow clicks meant for these. */
  #right-stack {
    position: fixed; top: 60px; right: 12px; z-index: 2;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    max-width: min(560px, calc(100vw - 24px)); pointer-events: none;
  }
  #right-stack > * { pointer-events: auto; }
  #run-line {
    display: flex; align-items: flex-start; justify-content: flex-end; gap: 8px;
    max-width: min(560px, calc(100vw - 24px));
  }
  #selection-panel {
    min-width: 176px; max-width: 240px; box-sizing: border-box;
    color: #e8edf1; background: #11151aef; border: 1px solid #ffffff17; border-radius: 6px;
    box-shadow: 0 8px 22px #0006, inset 0 1px 0 #ffffff0d;
    font: 12px/1.4 ui-sans-serif, system-ui; padding: 9px 11px 11px;
  }
  #fps-counter {
    min-width: 60px; box-sizing: border-box;
    color: #f4fbff; background: #171b20e8; border: 1px solid #ffffff2b;
    border-radius: 6px; font: 12px/1 ui-sans-serif, system-ui; font-variant-numeric: tabular-nums;
    padding: 7px 9px; text-align: right; text-shadow: 0 1px 2px #000;
  }
  #fps-counter[hidden] { display: none; }
  #selection-panel[hidden] { display: none; }
  #selection-panel .selection-kind {
    font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: #6b7681;
    padding-bottom: 6px; border-bottom: 1px solid #ffffff12;
  }
  #selection-panel dl { margin: 7px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; }
  #selection-panel dt { color: #a6b1ba; }
  #selection-panel dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  #touch-notice {
    position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
    cursor: pointer; appearance: none; text-align: center;
    max-width: min(520px, calc(100vw - 24px)); box-sizing: border-box;
    color: #f1e6c8; background: #463a20e8; border: 1px solid #ffffff26;
    border-radius: 6px; font: 12px/1.35 ui-sans-serif, system-ui; padding: 8px 12px;
    pointer-events: none;
  }
  #touch-notice[hidden] { display: none; }
  #compass {
    position: fixed; top: 12px; right: 12px; left: auto; transform: none;
    display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 86px; justify-content: center;
    color: #f4fbff; background: #171b20d8; border: 1px solid #ffffff2b;
    border-radius: 6px; font: 12px/1 ui-sans-serif, system-ui; font-variant-numeric: tabular-nums;
    padding: 7px 9px; box-sizing: border-box; text-shadow: 0 1px 2px #000;
    pointer-events: none;
  }
  #wave-banner {
    position: fixed; top: 68px; left: 50%; transform: translateX(-50%);
    max-width: min(360px, calc(100vw - 24px)); box-sizing: border-box;
    color: #e0d3ad; background: #11151aef; border: 1px solid #ffffff17;
    border-radius: 6px; box-shadow: 0 8px 22px #0006, inset 0 1px 0 #ffffff0d;
    font: 11.5px/1.3 ui-sans-serif, system-ui; font-variant-numeric: tabular-nums;
    padding: 7px 12px; text-align: center;
    pointer-events: none;
  }
  #wave-banner[hidden] { display: none; }
  #wave-banner[data-state="active"] { border-color: #ffcf66aa; color: #ffdf91; }
  #wave-banner[data-state="held"] { border-color: #8ee6a8aa; color: #bdf5cc; }
  #wave-banner[data-state="breached"] { border-color: #ff8d7aaa; color: #ffc5bc; }
  #between-runs {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px; max-width: min(560px, calc(100vw - 24px)); box-sizing: border-box;
    color: #e6ebef; background: #171b20e8; border: 1px solid #ffffff2b; border-radius: 6px;
    font: 12px/1.2 ui-sans-serif, system-ui; padding: 7px 9px;
  }
  #between-runs { max-width: min(360px, calc(100vw - 24px)); }
  #between-runs[hidden] { display: none; }
  #between-runs b { color: #f4fbff; font-weight: 600; }
  #between-runs button {
    color: #e6ebef; background: #272d34; border: 1px solid #ffffff2b; border-radius: 4px;
    padding: 3px 8px; cursor: pointer; font: inherit;
  }
  #upgrade-web { display: flex; flex-wrap: wrap; gap: 4px; }
  #upgrade-web button[data-owned="true"] { color: #bdf5cc; border-color: #8ee6a8aa; }
  .compass-heading { display: flex; align-items: center; gap: 7px; }
  .compass-needle {
    width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-bottom: 11px solid #75b9d1; transform-origin: 50% 70%;
  }
  /* A narrow column: label on the left, value on the right, one line each. It used to be ten
     columns across, which made a bar as wide as the screen with a hole in the middle of it. */
  /*
   * One status bar, centred on the top edge: the numbers a player watches while deciding, in the
   * order they decide with. Money leads because it gates every action. Each of these used to sit
   * in its own corner, so reading the city meant reading three corners.
   */
  #status-bar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 2;
    display: flex; align-items: stretch; max-width: calc(100vw - 24px);
    color: #e8edf1; background: #11151aef; border: 1px solid #ffffff17; border-radius: 6px;
    box-shadow: 0 8px 22px #0006, inset 0 1px 0 #ffffff0d;
    font: 11px/1.25 ui-sans-serif, system-ui; box-sizing: border-box;
  }
  #city-strip, #run-panel {
    display: flex; align-items: baseline; gap: 7px; padding: 6px 12px; white-space: nowrap;
    color: inherit; background: transparent; border: 0; font: inherit; text-align: left;
  }
  /* Each label belongs to the number after it, so the space goes before the label, not between. */
  #city-strip > span:not(:first-child), #run-panel > span:not(:first-child) { margin-left: 10px; }
  #run-panel button { margin-left: 11px; align-self: center; }
  #city-strip { cursor: pointer; }
  #city-strip:hover { background: #ffffff08; }
  #city-strip:focus-visible, #run-panel button:focus-visible { outline: 2px solid #75b9d1; outline-offset: -2px; }
  #run-panel { border-left: 1px solid #ffffff12; }
  #status-bar span { color: #6b7681; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
  /*
   * A reduced window drops the numbers that can wait before it drops the ones that cannot:
   * jobs and science go first, then population. Money and the wave always survive.
   */
  @media (max-width: 1340px) {
    #city-strip #workers, #city-strip #workers ~ span:first-of-type { display: none; }
    #run-panel #run-science { display: none; }
    #run-panel > span:nth-of-type(2) { display: none; }
  }
  @media (max-width: 1120px) {
    #city-strip #population, #city-strip > span:first-of-type { display: none; }
    /* Centred, it would sit on the settings panel the moment that opens. On a narrow window it
       takes the right edge instead, which nothing else is using up there. */
    #status-bar { left: auto; right: 12px; transform: none; }
    #compass { top: 62px; }
  }
  #status-bar b {
    color: #f4fbff; font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }
  #city-strip b#money { font-size: 14px; }
  #run-panel button {
    color: #d7dfe6; background: #212830; border: 1px solid #ffffff20; border-radius: 4px;
    padding: 3px 7px; font: inherit; cursor: pointer;
  }
  #run-panel button:hover { background: #2d353d; }
  #run-panel #call-wave { background: #33505b; border-color: #75b9d150; color: #fff; }
  #ledger {
    position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    width: min(340px, calc(100vw - 24px));
    color: #e6ebef; background: #171b20f2; border: 1px solid #ffffff26; border-radius: 7px;
    box-shadow: 0 5px 18px #0000004d; font: 11px/1.35 ui-sans-serif, system-ui; padding: 9px;
    box-sizing: border-box;
  }
  #ledger[hidden] { display: none; }
  /* The five needs run across the strip rather than down it: a column of short rows left a hole
     the width of the stats line beside it. */
  /* Five meters instead of nine lines of prose: what is short is read, not parsed. */
  .supply-top { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
  .supply-top span { color: #6b7681; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
  .supply-top span:nth-of-type(2) { margin-left: 10px; }
  .supply-top b { color: #f4fbff; font-weight: 600; font-size: 11px; font-variant-numeric: tabular-nums; }
  #supply {
    display: flex; flex-direction: column; gap: 5px; width: 200px; box-sizing: border-box;
    color: #e8edf1; font: 11px/1.25 ui-sans-serif, system-ui;
  }
  .supply-label { color: #6b7681; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
  #needs-panel { display: grid; gap: 7px; }
  #ledger-lines {
    display: grid; gap: 0; color: #c8d2d9; font-variant-numeric: tabular-nums;
  }
  #ledger-lines[data-empty="true"]::before {
    content: "No city yet."; color: #8fa0aa; padding: 2px 0;
  }
  .ledger-row {
    display: grid; grid-template-columns: 1fr auto 62px 62px; align-items: baseline; gap: 12px;
    padding: 4px 0; border-top: 1px solid #ffffff12;
  }
  .ledger-row:first-child { border-top: 0; }
  .ledger-row span { color: #8fa0aa; }
  .ledger-row b { color: #f4fbff; font-weight: 600; }
  .ledger-row i { font-style: normal; text-align: right; color: #7f8b93; }
  .ledger-row i:nth-of-type(1) { color: #8ee6a8; }
  .ledger-row[data-short="true"] b { color: #ffc5bc; }
  .ledger-row[data-short="true"] i:nth-of-type(2) { color: #ff8d7a; }
  /*
   * Label, bar, value -- side by side and no wider than they need to be. The value used to be
   * pushed to the far right of the whole strip by a `1fr` column, leaving a hole across the middle.
   */
  .need-row { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 2px 7px; font-size: 10.5px; }
  /* The default meter is a green plastic bar in every browser; this is the same one in the
     palette the rest of the overlay uses. */
  .need-row meter { width: 100%; height: 2px; min-width: 24px; appearance: none; }
  .need-row meter::-webkit-meter-bar {
    background: #ffffff14; border: 0; border-radius: 1px; height: 2px;
  }
  .need-row meter::-webkit-meter-optimum-value { background: #75b9d1; border-radius: 1px; }
  .need-row meter::-webkit-meter-suboptimum-value { background: #d9c48a; border-radius: 1px; }
  .need-row meter::-webkit-meter-even-less-good-value { background: #d98a8a; border-radius: 1px; }
  .need-row b { color: #7d8892; font-weight: 500; font-size: 9.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* Every click inside the strip belongs to the strip: a <meter> swallowed some of them, so
     opening the ledger worked or did not depending on the pixel. */
  #city-strip * { pointer-events: none; }
  @media (max-width: 680px) {
    #toolbar { max-width: calc(100vw - 24px); }
    #sun-hour { width: 72px; }
