<!doctype html>
<meta charset="utf-8" />
<title>city-jump</title>
<meta name="theme-color" content="#171b20" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/icon-128.png" type="image/png" sizes="128x128" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1e23; }
  #app { width: 100%; height: 100%; display: block; touch-action: none; }
  #toast {
    position: fixed; left: 50%; bottom: 116px; transform: translateX(-50%);
    font: 13px/1.4 ui-sans-serif, system-ui; color: #ffd9d0; background: #7a2718d0;
    padding: 8px 14px; border-radius: 6px; pointer-events: none; opacity: 0;
    transition: opacity .15s;
  }
  #toolbar {
    position: fixed; top: 12px; left: 12px; display: flex; align-items: stretch;
    max-width: calc(100vw - 24px); padding: 0; overflow: hidden;
    color: #e6ebef; background: #171b20e8; border: 1px solid #ffffff1f;
    border-radius: 6px; font: 12px/1.2 ui-sans-serif, system-ui; box-sizing: border-box;
  }
  #toolbar-content { display: flex; flex-direction: column; min-width: 0; padding: 2px 0; }
  #toolbar-content[hidden] { display: none; }
  .toolbar-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 6px 12px 6px 9px;
  }
  .toolbar-row + .toolbar-row { border-top: 1px solid #ffffff14; }
  /* A row that continues the one above it, so no rule between the two. */
  .toolbar-row + .toolbar-continued { padding-top: 0; border-top: 0; }
  .toolbar-actions button { flex: 1 1 0; }
  .row-label {
    flex: none; width: 40px; color: #7f8b95; font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase;
  }
  #toolbar label { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  #toolbar input, #toolbar select { accent-color: #75b9d1; }
  #toolbar-toggle {
    width: 34px; min-height: 38px; padding: 0; border: 0; border-left: 1px solid #ffffff1f;
    color: #b9c3ca; background: transparent; cursor: pointer;
  }
  #toolbar-toggle:hover { color: #fff; background: #2b343b; }
  #toolbar-toggle:focus-visible { outline: 2px solid #75b9d1; outline-offset: -2px; }
  #toolbar.collapsed #toolbar-toggle { border-left: 0; }
  #toolbar.collapsed #toolbar-content { display: flex; }
  #toolbar.collapsed .toolbar-row:not(.needs-row) { display: none; }
  .toolbar-glyph {
    display: inline-grid; gap: 4px; width: 18px; padding: 2px 0;
  }
  .toolbar-glyph i {
    display: block; height: 2px; border-radius: 2px; background: currentColor;
    transform-origin: center; animation: toolbar-pulse 1.8s ease-in-out infinite;
    transition: transform .25s ease, opacity .2s ease, width .25s ease;
  }
  .toolbar-glyph i:nth-child(1) { width: 13px; justify-self: start; }
  .toolbar-glyph i:nth-child(2) { width: 18px; justify-self: center; animation-delay: .15s; }
  .toolbar-glyph i:nth-child(3) { width: 10px; justify-self: end; animation-delay: .3s; }
  #toolbar.collapsed .toolbar-glyph i:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  #toolbar.collapsed .toolbar-glyph i:nth-child(2) { opacity: 0; transform: scaleX(.2); }
  #toolbar.collapsed .toolbar-glyph i:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  @keyframes toolbar-pulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.45); }
  }
  #time-controls {
    position: fixed; left: 12px; bottom: 144px;
    display: flex; align-items: center; gap: 8px; padding: 5px;
    max-width: calc(100vw - 24px); box-sizing: border-box;
    color: #e6ebef; background: #171b20e8; border: 1px solid #ffffff1f; border-radius: 6px;
    font: 12px/1.2 ui-sans-serif, system-ui;
  }
  #time-controls button {
    min-width: 34px; padding: 5px 8px; border: 0; border-right: 1px solid #ffffff18;
    color: #aeb8c0; background: transparent; font: inherit; cursor: pointer;
  }
  #time-controls button:last-child { border-right: 0; }
  #time-controls button[aria-pressed="true"] { color: #fff; background: #3c5965; }
  #sim-time { min-width: 86px; color: #b9dbe7; font-variant-numeric: tabular-nums; }
  .segmented { display: flex; border: 1px solid #ffffff2b; border-radius: 5px; overflow: hidden; }
  .segmented label { position: relative; }
  .segmented input { position: absolute; opacity: 0; }
  .segmented span { padding: 5px 8px; color: #aeb8c0; cursor: pointer; }
  .segmented input:checked + span { color: #fff; background: #3c5965; }
  #toolbar select { color: #e6ebef; background: #272d34; border: 1px solid #ffffff2b; border-radius: 4px; padding: 3px 5px; }
  #sun-hour { flex: 1 1 104px; min-width: 80px; }
  #save-slot { flex: 1 1 0; min-width: 0; }
  #toolbar button:not(#toolbar-toggle) {
    color: #e6ebef; background: #272d34; border: 1px solid #ffffff2b; border-radius: 4px;
    padding: 3px 8px; cursor: pointer; font: inherit;
  }
  #toolbar button:not(#toolbar-toggle):hover { background: #333c45; }
  #toolbar button:disabled { opacity: 0.45; cursor: default; }
  #sun-time { width: 38px; color: #b9dbe7; font-variant-numeric: tabular-nums; }
  #action-dock {
    position: fixed; right: 12px; bottom: 12px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    max-width: calc(100vw - 220px); color: #e6ebef;
    font: 12px/1.2 ui-sans-serif, system-ui;
  }
  #action-palette, .tool-options {
    background: #171b20f2; border: 1px solid #ffffff26; border-radius: 7px;
    box-shadow: 0 5px 18px #0000004d;
  }
  #action-palette { display: flex; max-width: 100%; overflow-x: auto; padding: 4px; box-sizing: border-box; }
  .tool-button {
    min-width: 78px; min-height: 40px; padding: 7px 10px; border: 0; border-right: 1px solid #ffffff18;
    color: #aeb8c0; background: transparent; font: inherit; cursor: pointer; white-space: nowrap;
  }
  .tool-button:last-child { border-right: 0; }
  .tool-button[aria-pressed="true"] { color: #fff; background: #3c5965; }
  .tool-button:disabled { color: #6f7a82; cursor: not-allowed; }
  .tool-button:hover { color: #fff; background: #2b343b; }
  .tool-button:focus-visible { outline: 2px solid #75b9d1; outline-offset: -2px; }
  .tool-options {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
    gap: 10px; max-width: 100%; padding: 7px 9px; box-sizing: border-box;
  }
  .tool-options[hidden] { display: none; }
  .tool-options label { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .tool-options input, .tool-options select { accent-color: #75b9d1; }
  .tool-options select { color: #e6ebef; background: #272d34; border: 1px solid #ffffff2b; border-radius: 4px; padding: 3px 5px; }
  .tool-options input[type="range"] { width: 92px; }
  /*
   * Everything that lives in the top-right corner shares one column, stacked in a fixed order --
   * FPS, run status, selection -- and flows: whatever is hidden takes no room and the rest closes
   * up. Each of these used to carry its own `top`, so showing two at once overlapped them and
   * showing three needed a rule per pair.
   */
  #right-stack {
    position: fixed; top: 12px; right: 12px; z-index: 2;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    max-width: min(560px, calc(100vw - 24px)); pointer-events: none;
  }
  #right-stack > * { pointer-events: auto; }
  #selection-panel {
    min-width: 150px; max-width: 240px;
    color: #e6ebef; background: #171b20e8; border: 1px solid #ffffff1f;
    border-radius: 6px; font: 12px/1.4 ui-sans-serif, system-ui; padding: 8px 12px;
    box-sizing: border-box;
  }
  #fps-counter {
    min-width: 60px; box-sizing: border-box;
    color: #f4fbff; background: #171b20e8; border: 1px solid #ffffff2b;
    border-radius: 6px; font: 12px/1 ui-sans-serif, system-ui; font-variant-numeric: tabular-nums;
    padding: 7px 9px; text-align: right; text-shadow: 0 1px 2px #000;
  }
  #fps-counter[hidden] { display: none; }
  #selection-panel[hidden] { display: none; }
  #selection-panel .selection-kind {
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #7f8b95;
  }
  #selection-panel dl { margin: 4px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
  #selection-panel dt { color: #aeb8c0; }
  #selection-panel dd { margin: 0; text-align: right; }
  #touch-notice {
    position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
    cursor: pointer; appearance: none; text-align: center;
    max-width: min(520px, calc(100vw - 24px)); box-sizing: border-box;
    color: #f1e6c8; background: #463a20e8; border: 1px solid #ffffff26;
    border-radius: 6px; font: 12px/1.35 ui-sans-serif, system-ui; padding: 8px 12px;
    pointer-events: none;
  }
  #touch-notice[hidden] { display: none; }
  #compass {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 86px; justify-content: center;
    color: #f4fbff; background: #171b20d8; border: 1px solid #ffffff2b;
    border-radius: 6px; font: 12px/1 ui-sans-serif, system-ui; font-variant-numeric: tabular-nums;
    padding: 7px 9px; box-sizing: border-box; text-shadow: 0 1px 2px #000;
    pointer-events: none;
  }
  #wave-banner {
    position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
    max-width: min(360px, calc(100vw - 24px)); box-sizing: border-box;
    color: #f4fbff; background: #171b20e8; border: 1px solid #ffffff2b;
    border-radius: 6px; font: 12px/1.25 ui-sans-serif, system-ui; font-variant-numeric: tabular-nums;
    padding: 8px 12px; text-align: center; text-shadow: 0 1px 2px #000;
    pointer-events: none;
  }
  #wave-banner[hidden] { display: none; }
  #wave-banner[data-state="active"] { border-color: #ffcf66aa; color: #ffdf91; }
  #wave-banner[data-state="held"] { border-color: #8ee6a8aa; color: #bdf5cc; }
  #wave-banner[data-state="breached"] { border-color: #ff8d7aaa; color: #ffc5bc; }
  #run-panel, #between-runs {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px; max-width: min(560px, calc(100vw - 24px)); box-sizing: border-box;
    color: #e6ebef; background: #171b20e8; border: 1px solid #ffffff2b; border-radius: 6px;
    font: 12px/1.2 ui-sans-serif, system-ui; padding: 7px 9px; text-shadow: 0 1px 2px #000;
  }
  #between-runs { max-width: min(360px, calc(100vw - 24px)); }
  #between-runs[hidden] { display: none; }
  #run-panel b, #between-runs b { color: #f4fbff; font-weight: 600; }
  #run-panel button, #between-runs button {
    color: #e6ebef; background: #272d34; border: 1px solid #ffffff2b; border-radius: 4px;
    padding: 3px 8px; cursor: pointer; font: inherit;
  }
  #upgrade-web { display: flex; flex-wrap: wrap; gap: 4px; }
  #upgrade-web button[data-owned="true"] { color: #bdf5cc; border-color: #8ee6a8aa; }
  .compass-heading { display: flex; align-items: center; gap: 7px; }
  .compass-needle {
    width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-bottom: 11px solid #75b9d1; transform-origin: 50% 70%;
  }
  #city-strip {
    position: fixed; left: 12px; bottom: 12px; display: grid; grid-template-columns: repeat(10, auto);
    align-items: center; gap: 10px; max-width: calc(100vw - 220px); box-sizing: border-box;
    color: #e6ebef; background: #171b20e8; border: 1px solid #ffffff1f; border-radius: 6px;
    font: 11px/1.2 ui-sans-serif, system-ui; padding: 7px 9px; text-align: left; cursor: pointer;
  }
  #city-strip span { color: #8fa0aa; }
  #city-strip b { color: #f4fbff; font-weight: 600; }
  #ledger {
    position: fixed; left: 12px; bottom: 190px; width: min(420px, calc(100vw - 24px));
    color: #e6ebef; background: #171b20f2; border: 1px solid #ffffff26; border-radius: 7px;
    box-shadow: 0 5px 18px #0000004d; font: 11px/1.35 ui-sans-serif, system-ui; padding: 9px;
    box-sizing: border-box;
  }
  #ledger[hidden] { display: none; }
  #needs-panel {
    grid-column: 1 / -1; display: grid; gap: 4px; width: 100%; min-width: 250px; color: #e6ebef;
    font: 11px/1 ui-sans-serif, system-ui; box-sizing: border-box;
  }
  #ledger-lines { display: grid; gap: 3px; margin-top: 8px; color: #c8d2d9; }
  .need-row { display: grid; grid-template-columns: 54px 70px 1fr; align-items: center; gap: 8px; }
  .need-row meter { width: 100%; height: 8px; }
  .need-row b { color: #c8d2d9; font-weight: 500; text-align: right; white-space: nowrap; }
  @media (max-width: 680px) {
    #toolbar { max-width: calc(100vw - 24px); }
    #sun-hour { width: 72px; }
    .tool-button { min-width: 70px; padding-inline: 8px; }
  }
</style>
<canvas id="app"></canvas>
<div id="compass" aria-label="Camera direction">
  <div class="compass-heading">
    <span class="compass-needle" aria-hidden="true"></span>
    <span class="compass-direction">N</span>
  </div>
</div>
<div id="wave-banner" hidden></div>
<div id="time-controls" aria-label="Simulation time">
  <div class="segmented">
    <button type="button" data-time-rate="0" aria-pressed="true" title="Pause">Pause</button>
    <button type="button" data-time-rate="1" aria-pressed="false" title="Play">Play</button>
    <button type="button" data-time-rate="2" aria-pressed="false" title="Double speed">x2</button>
    <button type="button" data-time-rate="4" aria-pressed="false" title="Quadruple speed">x4</button>
  </div>
  <output id="sim-time">Day 1 18:30</output>
</div>
<button id="city-strip" type="button" aria-expanded="false" aria-controls="ledger">
  <span>Pop</span><b id="population">0 residents</b>
  <span>Money</span><b id="money">$40,000 +$0.0/s</b>
  <span>Workers</span><b id="workers">0/0</b>
  <span>Food</span><b id="food">0</b>
  <span>Short</span><b id="shortage">None</b>
  <span id="needs-panel" aria-label="City needs"></span>
</button>
<div id="ledger" hidden>
  <div id="ledger-lines"></div>
</div>
<div id="toolbar">
  <div id="toolbar-content">
    <div class="toolbar-row">
      <span class="row-label">World</span>
      <label><input id="show-grid" type="checkbox" /> Grid</label>
      <label><input id="show-buildings" type="checkbox" checked /> Buildings</label>
      <label><input id="show-fps" type="checkbox" /> Show FPS</label>
    </div>
    <div class="toolbar-row toolbar-continued">
      <span class="row-label">Look</span>
      <label><input id="fx-antialias" type="checkbox" checked /> Smooth</label>
      <label><input id="fx-bloom" type="checkbox" checked /> Glow</label>
      <label><input id="fx-ao" type="checkbox" /> Depth</label>
      <label><input id="fx-tilt" type="checkbox" /> Miniature</label>
    </div>
    <div class="toolbar-row toolbar-continued">
      <span class="row-label"></span>
      <label><input id="show-shadows" type="checkbox" checked /> Shadows</label>
      <label><input id="show-lights" type="checkbox" checked /> Lights</label>
      <label>Frames
        <select id="frame-cap" aria-label="Frame rate cap">
          <option value="30">30</option>
          <option value="60" selected>60</option>
          <option value="120">120</option>
          <option value="0">Max</option>
        </select>
      </label>
    </div>
    <div class="toolbar-row toolbar-continued">
      <span class="row-label"></span>
      <label><input id="show-traffic" type="checkbox" checked /> Traffic</label>
      <label>Busy <input id="traffic-density" type="range" min="0.25" max="2" step="0.25" value="1" aria-label="Traffic density" /></label>
    </div>
    <div class="toolbar-row">
      <span class="row-label">Sun</span>
      <input id="sun-hour" type="range" min="0" max="24" step="0.25" value="18.5" aria-label="Hour of day" />
      <output id="sun-time" for="sun-hour">14:00</output>
    </div>
    <div class="toolbar-row toolbar-continued">
      <span class="row-label"></span>
      <label><input id="sun-auto" type="checkbox" /> Auto</label>
      <label><input id="short-night" type="checkbox" checked /> Short night</label>
    </div>
    <div class="toolbar-row">
      <span class="row-label">Camera</span>
      <label><input type="radio" name="camera-mode" value="free" checked /> Free</label>
      <label><input type="radio" name="camera-mode" value="orbit" /> Orbit</label>
      <label><input type="radio" name="camera-mode" value="follow" /> Follow</label>
    </div>
    <div class="toolbar-row">
      <span class="row-label">Gameplay</span>
      <label title="A defeat deletes this run's save."><input id="hardcore-run" type="checkbox" /> Hardcore</label>
      <label title="Uncheck for a city builder with no attacks at all."><input id="kaiju-spawns" type="checkbox" checked /> Kaiju attacks</label>
      <span id="gameplay-note"></span>
    </div>
    <div class="toolbar-row toolbar-continued">
      <span class="row-label"></span>
      <label title="Buildings finish the moment they are placed."><input id="instant-construction" type="checkbox" /> Build instantly</label>
      <label title="Buildings and roads cost nothing."><input id="free-building" type="checkbox" /> Ignore build costs</label>
    </div>
    <div class="toolbar-row">
      <span class="row-label">City</span>
      <select id="save-slot" aria-label="Saved cities"></select>
    </div>
    <div class="toolbar-row toolbar-continued toolbar-actions">
      <span class="row-label"></span>
      <button id="undo-city" type="button" title="Undo the last city change">Undo</button>
      <button id="redo-city" type="button" title="Redo the last city change">Redo</button>
    </div>
    <div class="toolbar-row toolbar-continued toolbar-actions">
      <span class="row-label"></span>
      <button id="save-share" type="button" title="Share the current city by link">Share</button>
      <button id="save-export" type="button" title="Export the current city to a file">Export</button>
      <button id="save-import" type="button" title="Import a city from a file">Import</button>
      <button id="settings-reset" type="button" title="Put every setting back to its default">Reset</button>
      <input id="save-import-file" type="file" accept="application/json,.json" hidden />
    </div>
    <div class="toolbar-row toolbar-continued toolbar-actions">
      <span class="row-label"></span>
      <button id="save-new" type="button" title="Start a new, empty city">New</button>
      <button id="save-store" type="button" title="Save the current city">Save</button>
      <button id="save-load" type="button" title="Load the selected city">Load</button>
      <button id="save-delete" type="button" title="Delete the selected city">Delete</button>
    </div>
  </div>
  <button id="toolbar-toggle" type="button" aria-expanded="true" aria-controls="toolbar-content" title="Collapse settings">
    <span class="toolbar-glyph" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>
</div>
<div id="action-dock">
  <div id="select-view-options" class="tool-options">
    <div class="segmented" role="group" aria-label="View">
      <label><input type="radio" name="select-view" value="all" checked /><span>All</span></label>
      <label><input type="radio" name="select-view" value="no-buildings" /><span>Zones</span></label>
      <label><input type="radio" name="select-view" value="traffic" /><span>Traffic</span></label>
      <label><input type="radio" name="select-view" value="utilities" /><span>Utilities</span></label>
      <label><input type="radio" name="select-view" value="state" /><span>State</span></label>
    </div>
  </div>
  <div id="road-type-options" class="tool-options" hidden>
    <div class="segmented" role="group" aria-label="Road type">
      <label><input type="radio" name="road-type" value="pedestrian" /><span>Pedestrian</span></label>
      <label><input type="radio" name="road-type" value="street" checked /><span>Street</span></label>
      <label><input type="radio" name="road-type" value="avenue" /><span>Avenue</span></label>
      <label><input type="radio" name="road-type" value="industrial" /><span>Industrial</span></label>
      <label><input type="radio" name="road-type" value="dirt" /><span>Dirt</span></label>
      <label><input type="radio" name="road-type" value="military" /><span>Military</span></label>
      <label><input type="radio" name="road-type" value="highway" /><span>Highway</span></label>
      <label><input type="radio" name="road-type" value="tunnel" /><span>Tunnel</span></label>
    </div>
  </div>
  <div id="road-options" class="tool-options" hidden>
    <div class="segmented" role="group" aria-label="Road shape">
      <label><input type="radio" name="road-shape" value="straight" checked /><span>Straight</span></label>
      <label><input type="radio" name="road-shape" value="curve" /><span>Curve</span></label>
      <label><input type="radio" name="road-shape" value="roundabout" /><span>Roundabout</span></label>
    </div>
    <label><input id="road-lanes" type="checkbox" /> Two lanes</label>
    <label><input id="road-oneway" type="checkbox" /> One-way</label>
    <label><input id="grid-snap" type="checkbox" checked /> Snap</label>
    <output id="road-price">$8/m</output>
  </div>
  <div id="nature-options" class="tool-options" hidden>
    <div class="segmented" role="group" aria-label="Planting mode">
      <label><input type="radio" name="plant-mode" value="plant" checked /><span>Single</span></label>
      <label><input type="radio" name="plant-mode" value="spray" /><span>Spray</span></label>
    </div>
    <label>Tree
      <select id="tree-species">
        <option value="fir">Fir</option>
        <option value="oak">Oak</option>
        <option value="apple">Apple</option>
        <option value="palm">Palm</option>
      </select>
    </label>
    <label>Brush <input id="spray-radius" type="range" min="16" max="96" step="8" value="45" aria-label="Spray brush size" /></label>
  </div>
  <div id="zone-options" class="tool-options" hidden>
    <div class="segmented" role="group" aria-label="Zone kind">
      <label><input type="radio" name="zone-kind" value="residential" checked /><span>Residential</span></label>
      <label><input type="radio" name="zone-kind" value="commercial" /><span>Commercial</span></label>
      <label><input type="radio" name="zone-kind" value="industrial" /><span>Industrial</span></label>
      <label><input type="radio" name="zone-kind" value="agricultural" /><span>Agriculture</span></label>
      <label><input type="radio" name="zone-kind" value="military" /><span>Military</span></label>
      <label><input type="radio" name="zone-kind" value="clear" /><span>Clear</span></label>
    </div>
    <label>Brush <input id="zone-radius" type="range" min="8" max="96" step="8" value="45" aria-label="Zone brush size" /></label>
    <output id="zone-price">Zone</output>
  </div>
  <div id="utility-options" class="tool-options" hidden>
    <div class="segmented" role="group" aria-label="Utility role">
      <label><input type="radio" name="utility-role" value="producer" checked /><span>Producer</span></label>
      <label><input type="radio" name="utility-role" value="diffuser" /><span>Diffuser</span></label>
    </div>
    <output id="utility-price">$3,200 | 6 staff</output>
  </div>
  <div id="action-palette" role="toolbar" aria-label="Build tools">
    <button class="tool-button" type="button" data-tool="select" aria-pressed="true">Select</button>
    <button class="tool-button" type="button" data-tool="roads" aria-pressed="false">Roads</button>
    <button class="tool-button" type="button" data-tool="zones" aria-pressed="false">Zones</button>
    <button class="tool-button" type="button" data-tool="power" aria-pressed="false">Power</button>
    <button class="tool-button" type="button" data-tool="water" aria-pressed="false">Water</button>
    <button class="tool-button" type="button" data-tool="nature" aria-pressed="false">Nature</button>
    <button class="tool-button" type="button" data-tool="bulldoze" aria-pressed="false">Bulldoze</button>
  </div>
</div>
<div id="right-stack">
<div id="fps-counter" hidden></div>
<div id="run-panel" aria-label="Run status">
  <span>Wave <b id="run-wave">1</b></span>
  <span>Science <b id="run-science">0</b></span>
  <button id="call-wave" type="button">Call wave</button>
  <button id="evacuate-run" type="button">Evacuate</button>
</div>
<div id="between-runs" aria-label="Between runs" hidden>
  <span>Prestige <b id="profile-prestige">0</b></span>
  <span id="upgrade-web" aria-label="Prestige upgrades"></span>
</div>
<div id="selection-panel" hidden>
  <div class="selection-kind"></div>
  <dl></dl>
</div>
</div>
<button id="touch-notice" type="button" hidden title="Dismiss">Building needs a mouse. Look around freely.</button>
<div id="toast"></div>
<script>
  const touchNotice = document.getElementById("touch-notice");
  if (matchMedia("(pointer: coarse)").matches) touchNotice.hidden = false;
  touchNotice.addEventListener("click", () => { touchNotice.hidden = true; });
</script>
<script type="module" src="/src/main.ts"></script>
